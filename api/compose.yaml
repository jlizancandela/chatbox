services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chatbox}
    volumes:
      - pgvector-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      # La API espera a que PostgreSQL acepte conexiones: sin esto, el primer arranque
      # choca contra la base de datos todavía arrancando.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chatbox}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: jlizancandela/api_chatbox:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # La URL de la base de datos apunta al servicio de Compose, no a `localhost`:
      # dentro de la red de Compose la base vive en `db`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chatbox}
      PORT: "7000"
      NODE_ENV: production
      # Los pesos viajan en la imagen. Se fija aquí porque `env_file` tiene prioridad
      # sobre el ENV del Dockerfile y en local la ruta es otra.
      EMBEDDING_CACHE_DIR: /app/model
    # El puerto se ata a la interfaz de bucle, no a todas. Sin esto, cualquiera que
    # alcance el host entra directo a la API: se salta el proxy inverso, con su TLS y su
    # protección, y el límite por IP y el `trustProxy` dejan de tener sentido (#143).
    #
    # En el servidor, el patrón de los demás servicios es no publicar nada: el proxy
    # llega al contenedor por la red externa. Aquí se ata a `127.0.0.1` para que en
    # local siga siendo alcanzable sin abrirla al mundo.
    ports:
      - "127.0.0.1:7000:7000"
    # EmbeddingGemma q4 mide ~620 MB de RSS en el contenedor. El límite deja aire
    # para el pico de carga y evita que un fallo del modelo arrastre al resto.
    mem_limit: 1g
    # `default` se queda a propósito: es la red por la que encuentra a `db`, porque la
    # URL de la base apunta al nombre del servicio. `traefik-public` es la que comparte
    # con el proxy, y es la única puerta de entrada desde fuera.
    networks:
      - default
      - traefik-public
    # El túnel de Cloudflare ya manda cualquier subdominio a Traefik (el comodín está
    # ahí), así que lo único que falta para que `api` exista es que Traefik sepa a qué
    # contenedor va este host. Eso es lo que declaran estas etiquetas: no hace falta
    # ningún hostname público en Cloudflare.
    #
    # `traefik.docker.network` no es decorativo: el contenedor está en dos redes y, sin
    # esta etiqueta, Traefik puede elegir la equivocada y no alcanzarlo.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.chatbox.rule=Host(`api.jorgelizancandela.com`)"
      - "traefik.http.routers.chatbox.entrypoints=web"
      - "traefik.http.services.chatbox.loadbalancer.server.port=7000"

volumes:
  pgvector-data:

networks:
  # La red del proxy ya existe en el servidor y la comparten los demás servicios, así
  # que se declara externa: Compose la usa pero no la crea ni la borra.
  traefik-public:
    external: true
