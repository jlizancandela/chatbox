name: Publish widget

# El paquete se publica al empujar un tag de versión: `npm version 0.1.0` dentro de
# `frontend/` deja la versión en el `package.json` y crea el tag `v0.1.0` en el
# repositorio. El tag es lo que dispara la publicación.
#
# El destino es el registro npm de GitHub Packages (`npm.pkg.github.com`), no npmjs.org:
# el paquete se publica con el `GITHUB_TOKEN` del propio workflow, así que no hay ni
# cuenta de npm, ni 2FA, ni token de por vida que rotar.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publicar el paquete en GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Packages: sin este permiso, el `GITHUB_TOKEN` no puede publicar el
      # paquete.
      packages: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Con `registry-url` de GitHub Packages, la acción deduce el scope del
      # repositorio (`@jlizancandela`) y escribe la autenticación del token. Las
      # dependencias sin scope siguen viniendo de npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `verify` es la lista única (lint + typecheck + build + tests). Si se escribe aquí
      # paso a paso, el hook y el documento se desincronizan sin que nadie lo note.
      - name: Verify
        run: npm run verify

      # Lo que se publica se ve antes de publicarlo: el tarball tiene que llevar el
      # código del widget y nada más.
      - name: Inspect the tarball
        run: npm pack --dry-run

      # Sin `--access public`: la visibilidad en GitHub Packages se decide en los
      # ajustes del paquete, no en el comando.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
