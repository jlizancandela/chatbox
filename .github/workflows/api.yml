name: API CI

# La suite de la API corre en cada PR y en cada push a `main`. La imagen se publica
# solo cuando la verificación pasa y solo desde `main`: el VPS tira de ella con
# `docker compose pull`, así que la imagen es el artefacto que se despliega.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      db:
        # El esquema usa `vector(768)`, así que la imagen de PostgreSQL tiene que traer
        # pgvector.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbox
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d chatbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Sin claves de proveedor: la suite inyecta los dobles por el seam de la
    # aplicación y el guardián de red corta cualquier llamada que se escape. Lo que
    # queda aquí es infraestructura (la base de datos) y configuración, no credenciales.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatbox
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      # `pnpm/action-setup` busca la versión de pnpm en la raíz del repositorio, no en el
      # directorio de trabajo: sin esta ruta no encuentra el campo `packageManager` de
      # `api/package.json` y falla antes de instalar nada.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: api/package.json
          cache_dependency_path: api/pnpm-lock.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      # `verify` es la lista única: compilación, typecheck de los tests y suite. Si se
      # escribe aquí paso a paso, el comando local y el de CI se desincronizan sin que
      # nadie lo note.
      - name: Verify
        run: pnpm verify

  publish:
    name: Build and push the image
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          # El usuario es una **variable** del repositorio, no un secreto: no es un dato
          # sensible y así se puede leer en el log sin miedo. El token sí es secreto.
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # El nombre de la imagen es parte del contrato de despliegue (el compose del VPS
          # lo fija), así que vive aquí y no en una variable.
          images: jlizancandela/api_chatbox
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
