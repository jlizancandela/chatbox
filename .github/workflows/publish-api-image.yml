name: Publish API image

# La imagen se publica en cada push a `main` que toca la API: el VPS tira de ella con
# `docker compose pull`, así que la imagen es el artefacto que se despliega.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/publish-api-image.yml"

jobs:
  build:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # La imagen compila el TypeScript en su etapa de build: si eso falla, la imagen
      # fallaría al construirse. Compilarlo aquí deja que un error de tipos no llegue a
      # Docker Hub.
      - name: Build
        run: pnpm build:ts

  publish:
    name: Build and push the image
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: jlizancandela/chatbox-api
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
