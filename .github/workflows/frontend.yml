name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  frontend:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `verify` es la lista única (lint + typecheck + build + tests). Si se escribe aquí
      # paso a paso, el hook y el documento se desincronizan sin que nadie lo note.
      - name: Verify
        run: npm run verify

      - name: Browser tests
        run: npm run test:browser
