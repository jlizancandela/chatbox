<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<!-- `viewport-fit=cover` deja que la página llegue al borde de la pantalla; sin él,
		     el navegador deja el contenido dentro de la zona segura y `env(safe-area-inset-*)`
		     vale cero en todas partes (RF-F50). Un sitio que embebe el widget necesita lo mismo
		     en su propia etiqueta `viewport`. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>Vite + Preact</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
